<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Link inbox — gen-ai-journal</title>
  <style>
    :root { --accent: #d96b0b; --line: #ddd8ce; --muted: #6a6f7a; }
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 6vh auto; padding: 0 20px; color: #21252d; line-height: 1.55; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters button { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 4px 14px; font-size: 13px; cursor: pointer; }
    .filters button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; }
    li .u a { color: #1f4e79; word-break: break-all; text-decoration-thickness: 1px; }
    li .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    li .meta .nnn { color: var(--accent); font-weight: 600; }
    li .meta a.lid { color: #1f4e79; font-weight: 600; }
    .pill { font-size: 11px; padding: 1px 9px; border-radius: 20px; background: #eee; }
    .pill.new { background: #e7f2ea; color: #22633c; }
    .pill.consumed { background: #e8eef5; color: #33567a; }
    .pill.dismissed { background: #f0f0ee; color: #888; }
    .pill.blocked { background: #fbe9e7; color: #a33326; }
    .err { color: #a33326; font-size: 12px; margin-top: 2px; word-break: break-all; }
    .note { font-size: 13px; color: #444; margin-top: 4px; }
    #empty { color: var(--muted); font-size: 14px; padding: 28px 0; }
    nav { margin-top: 28px; font-size: 13.5px; }
    nav a { color: var(--accent); margin-right: 14px; }
    #events { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px; }
    #events h2 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; }
    #events h2 a { font-size: 12.5px; font-weight: 400; color: var(--accent); }
    #events table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    #events td { padding: 3px 8px 3px 0; border-bottom: 1px dotted var(--line); vertical-align: top; }
    #events td.ts { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
    #events td.ev { font-family: ui-monospace, monospace; font-size: 11.5px; white-space: nowrap; }
    #events .pill { font-size: 10px; }
    #events .pill.editor { background: #e8eef5; color: #33567a; }
    #events .pill.pipeline { background: #fdf3e4; color: #8a5307; }
    #events td.subj { white-space: nowrap; color: #444; }
    #events td.subj a { color: #1f4e79; }
  </style>
</head>
<body>
  <h1>Link inbox</h1>
  <p class="sub">Submitted candidates, rendered as-is. <span id="count"></span></p>
  <div class="filters" id="filters">
    <button data-s="" class="on">all</button>
    <button data-s="new">generating</button>
    <button data-s="summarized">summarized</button>
    <button data-s="blocked">blocked</button>
    
    <button data-s="dismissed">dismissed</button>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden>Nothing here yet.</div>

  <section id="events" hidden>
    <h2>Latest events <a href="/admin/logs">full audit log →</a></h2>
    <table><tbody id="ev-rows"></tbody></table>
  </section>

  <nav><a href="/submit">→ submit a link</a><a href="/admin/pipeline">console</a><a href="/admin/logs">events log</a></nav>

  <script>
    let current = "";
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    async function load() {
      const q = current ? "?status=" + current : "";
      const res = await fetch("/api/links" + q, { credentials: "same-origin" });
      if (!res.ok) { empty.hidden = false; empty.textContent = "Failed to load (" + res.status + ")"; list.innerHTML = ""; return; }
      const data = await res.json();
      count.textContent = data.count + " link" + (data.count === 1 ? "" : "s");
      list.innerHTML = "";
      empty.hidden = data.count !== 0;
      for (const l of data.links) {
        const li = document.createElement("li");
        const u = document.createElement("div"); u.className = "u";
        const a = document.createElement("a"); a.href = l.url; a.textContent = l.url; a.target = "_blank"; a.rel = "noreferrer";
        u.appendChild(a); li.appendChild(u);
        if (l.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = l.note; li.appendChild(n); }
        if (l.error) { const er = document.createElement("div"); er.className = "err"; er.textContent = l.error; li.appendChild(er); }
        const meta = document.createElement("div"); meta.className = "meta";
        const pill = document.createElement("span"); pill.className = "pill " + l.status; pill.textContent = l.status === "new" ? "generating" : l.status;
        meta.appendChild(pill);
        if (l.summary_id) {
          const nnn = document.createElement("span");
          nnn.className = "nnn";
          nnn.textContent = "NNN " + l.summary_id;
          meta.appendChild(nnn);
        }
        const t = document.createElement("span"); t.textContent = (l.submitted_at || "").replace("T", " ").slice(0, 16);
        meta.appendChild(t);
        // Read-mostly list (#173): actions live on the link detail page —
        // every submission has one, blocked/failed runs included.
        const lid = document.createElement("a");
        lid.className = "lid";
        lid.href = "/admin/links/" + l.id;
        lid.textContent = "L" + l.id;
        lid.title = "link detail: status, content, actions, run log";
        meta.appendChild(lid);
        li.appendChild(meta);
        list.appendChild(li);
      }
    }

    async function loadEvents() {
      const res = await fetch("/api/events?limit=15", { credentials: "same-origin" });
      if (!res.ok) return;
      const d = await res.json();
      const panel = document.getElementById("events");
      const rows = document.getElementById("ev-rows");
      panel.hidden = d.count === 0;
      rows.innerHTML = "";
      for (const e of d.events) {
        const tr = document.createElement("tr");
        const ts = document.createElement("td"); ts.className = "ts"; ts.textContent = (e.ts || "").slice(5, 16).replace("T", " ");
        const actor = document.createElement("td");
        const pill = document.createElement("span"); pill.className = "pill " + e.actor; pill.textContent = e.actor;
        actor.appendChild(pill);
        const ev = document.createElement("td"); ev.className = "ev"; ev.textContent = e.event;
        const subj = document.createElement("td"); subj.className = "subj";
        if (e.summary_id) subj.appendChild(document.createTextNode("NNN " + e.summary_id + (e.link_id != null ? " · " : "")));
        if (e.link_id != null) {
          const a = document.createElement("a");
          a.href = "/admin/links/" + Number(e.link_id);
          a.textContent = "L" + Number(e.link_id);
          subj.appendChild(a);
        } else if (!e.summary_id) {
          subj.textContent = "–";
        }
        tr.appendChild(ts); tr.appendChild(actor); tr.appendChild(ev); tr.appendChild(subj);
        rows.appendChild(tr);
      }
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      current = e.target.dataset.s;
      for (const b of document.querySelectorAll("#filters button")) b.classList.toggle("on", b === e.target);
      load();
    });
    load();
    loadEvents();
    setInterval(loadEvents, 30_000);
  </script>
</body>
</html>
